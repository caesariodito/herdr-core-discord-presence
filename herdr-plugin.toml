id = "herdr-discord-presence"
name = "Discord Presence"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Discord Rich Presence showing your Herdr session and agent status"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "install"]

[[build]]
command = ["npm", "run", "build"]

[[startup]]
command = ["node", "dist/launcher.js"]

[[actions]]
id = "start"
title = "Start Discord presence"
command = ["node", "dist/launcher.js"]

[[actions]]
id = "stop"
title = "Stop Discord presence"
command = ["node", "dist/stop.js"]

[[actions]]
id = "status"
title = "Discord presence status"
command = ["node", "dist/status.js"]
